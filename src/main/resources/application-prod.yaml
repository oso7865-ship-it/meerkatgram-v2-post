server:
  port: ${APP_PORT}

spring:
  application:
    name: meerkatgram-v2-post
    version: v2
  web:
    error:
      include-stacktrace: never
      include-message: never

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  # DB
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  # JPA
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 100
    defer-datasource-initialization: true
  sql:
    init:
      data-locations: classpath*:dummy/*.sql
      mode: never
      platform: all

# Springdoc Openapi
springdoc:
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  swagger-ui:
    enabled: false
  api-docs:
    path: /api-docs
  open-api:
    servers:
      - url: ${GATEWAY_URI}
        description: ${APP_DESCRIPTION}

# Log
logging:
  file:
    name: logs/error.log
  level:
    root: warn
    com.meerkatgramv2auth: error

# minio
minio:
  minio-endpoint: ${FILE_ENDPOINT_URI}
  minio-bucket: ${FILE_BUCKET}
  minio-access-key: ${FILE_ACCESS_KEY}
  minio-secret-key: ${FILE_SECRET_KEY}
  minio-image-path: ${FILE_IMAGE_PATH}
  allow-image-extensions: [
    "image/jpg",
    "image/jpeg",
    "image/png",
    "image/gif",
    "image/webp"
  ]
